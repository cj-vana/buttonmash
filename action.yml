name: 'ButtonMash Chaos Monkey'
description: 'Run the buttonmash CI chaos monkey against a web app and fail the build on findings.'
branding:
  icon: 'alert-triangle'
  color: 'orange'
inputs:
  target:
    description: 'URL to test (your app must already be running/served).'
    required: true
  args:
    description: 'Extra buttonmash CLI args (e.g. "--seed ci --max-actions 800 --config buttonmash.config.ts"). Split like a shell command line, so quotes group words: --baseline-id "staging admin". Nothing is globbed. --out/-o and --browser/-b are rejected: the report location is fixed so the outputs and upload can find it, and the engine comes from the browser input.'
    required: false
    default: ''
  version:
    description: 'buttonmash npm version or spec to install (latest, 0.3.0, a file: tarball). Empty installs the version in the package.json of the action ref you use, so @v0.3.0 runs 0.3.0.'
    required: false
    default: ''
  node-version:
    description: 'Node version.'
    required: false
    default: '24'
  browser:
    description: 'Browser engine: chromium | firefox | webkit. The action installs this engine before it can read your config and passes it as --browser, so it decides the engine and overrides browser in a buttonmash config file.'
    required: false
    default: 'chromium'
  fail-on:
    description: 'Minimum finding severity that fails the build: critical | high | medium | low | info. Empty uses failOn from your buttonmash config, which defaults to high; a value here overrides the config.'
    required: false
    default: ''
  upload-report:
    description: 'Upload the buttonmash-report/ directory as a build artifact.'
    required: false
    default: 'true'
  report-name:
    description: 'Name of the uploaded report artifact. Names must be unique within a workflow run, so when the action runs more than once (a matrix over browsers, several targets), set a different name in each job, for example buttonmash-report-firefox from the matrix value.'
    required: false
    default: 'buttonmash-report'
outputs:
  exit-code:
    description: 'buttonmash exit code (0 clean, 1 findings/safety stop, 2 tool error/interruption).'
    value: ${{ steps.run.outputs.exit-code }}
  findings:
    description: 'Total number of findings.'
    value: ${{ steps.run.outputs.findings }}
  report-path:
    description: 'Path to the report directory.'
    value: ${{ steps.run.outputs.report-path }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
    - id: install
      shell: bash
      env:
        BM_VERSION: ${{ inputs.version }}
        BM_BROWSER: ${{ inputs.browser }}
      run: |
        DIR="${RUNNER_TEMP:-/tmp}/buttonmash"
        mkdir -p "$DIR" && cd "$DIR"
        npm init -y >/dev/null 2>&1
        # Empty means the release this copy of the action belongs to, so
        # cj-vana/buttonmash@v0.3.0 installs buttonmash 0.3.0, not latest.
        if [ -z "$BM_VERSION" ]; then
          BM_VERSION=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")
        fi
        npm i "buttonmash@${BM_VERSION}" >/dev/null
        # Install the browser matching buttonmash's bundled Playwright version.
        npx playwright install --with-deps "${BM_BROWSER}"
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
    - id: run
      shell: bash
      # Run from the workspace so a committed buttonmash.config.* is discovered
      # and repo-relative --config paths resolve. Inputs go through env, never
      # interpolated into the script, because ${{ }} expands before bash sees the
      # text, so a crafted `target` would otherwise execute on the runner.
      working-directory: ${{ github.workspace }}
      env:
        BM_DIR: ${{ steps.install.outputs.dir }}
        BM_TARGET: ${{ inputs.target }}
        BM_BROWSER: ${{ inputs.browser }}
        BM_FAIL_ON: ${{ inputs.fail-on }}
        BM_ARGS: ${{ inputs.args }}
      run: |
        set +e
        reject() {
          echo "::error::$1"
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 2
        }
        # Split args the way a shell would, so quotes group words. xargs does
        # the quote handling, and the array is only expanded quoted, so nothing
        # is globbed. No mapfile: macOS runners can have bash 3.2. The blank
        # check matters because GNU xargs runs printf once on empty input.
        BM_EXTRA=()
        if [ -n "${BM_ARGS//[[:space:]]/}" ]; then
          printf '%s\n' "$BM_ARGS" | xargs -n1 printf '%s\n' > "$BM_DIR/args.txt" ||
            reject "Could not split the args input; look for an unmatched quote."
          while IFS= read -r arg; do
            BM_EXTRA+=("$arg")
          done < "$BM_DIR/args.txt"
        fi
        # commander keeps the last value, so these would silently beat the
        # action's own --out and --browser.
        for arg in "${BM_EXTRA[@]}"; do
          case "$arg" in
            --out | --out=* | -o*)
              reject "Remove --out (-o) from args. The action always writes the report to buttonmash-report/ in the workspace, where the findings and report-path outputs and the upload look for it. Read its location from the report-path output and name the artifact with the report-name input." ;;
            --browser | --browser=* | -b*)
              reject "Remove --browser (-b) from args and set the browser input instead. The action installs only the engine named by that input." ;;
          esac
        done
        BM_OPTS=(--browser "$BM_BROWSER" --out "$GITHUB_WORKSPACE/buttonmash-report")
        # CLI flags beat the config file, so pass --fail-on only when asked to.
        if [ -n "$BM_FAIL_ON" ]; then
          BM_OPTS+=(--fail-on "$BM_FAIL_ON")
        fi
        "$BM_DIR/node_modules/.bin/buttonmash" run "$BM_TARGET" "${BM_OPTS[@]}" "${BM_EXTRA[@]}"
        CODE=$?
        echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"
        echo "report-path=$GITHUB_WORKSPACE/buttonmash-report" >> "$GITHUB_OUTPUT"
        FINDINGS=$(node -p "try{require(process.env.GITHUB_WORKSPACE+'/buttonmash-report/results.json').findings.length}catch{''}" 2>/dev/null || echo '')
        echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
        exit $CODE
    - if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.report-name }}
        path: buttonmash-report/
        if-no-files-found: ignore
        retention-days: 14
